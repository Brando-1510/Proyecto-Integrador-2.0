[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Finanzen"
version = "1.0.0"
description = "Proyecto de análisis financiero para Pymes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.1.0",
    "cffi==2.1.1",
    "greenlet==3.5.5",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "mysql-connector-python==26.7.0",
    "pycparser==3.0",
    "PySide6==6.11.1",
    "PySide6_Addons==6.11.1",
    "PySide6_Essentials==6.11.1",
    "python-dotenv==1.2.3",
    "shiboken6==6.11.1",
    "SQLAlchemy==2.0.52",
    "typing_extensions==4.16.0"
]

[tool.setuptools]
packages = ["."]